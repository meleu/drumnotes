# The gates lefthook runs locally, re-run where they cannot be skipped, plus the
# deploy that follows.
#
# `verify` and `e2e` are separate jobs: independent, and the browser suite is far
# slower, so a lint error comes back in a minute instead of behind Chromium.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer commit makes an in-flight check pointless, so PR runs are cancelled
# when superseded. `main` runs are left alone: they end in a deployment, and
# half-finished deployments are not worth being clever about.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      # `pnpm run verify` is this chain, but as one step a failure only says
      # "verify failed". Split, the failing check is the step name.
      - name: Check formatting
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run check

      - name: Unit tests
        run: pnpm run test:unit

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      # `test:e2e` installs the browser too, but without the system libraries a
      # bare runner needs. `--with-deps` here covers that and makes that a no-op.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright
        run: pnpm run test:e2e

      # The config records a trace on the first retry — the only way to see what
      # the browser saw.
      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  deploy:
    name: Deploy to GitHub Pages
    needs: [verify, e2e]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Publish the artifact, and prove to Pages that this workflow produced it.
      pages: write
      id-token: write

    # One shared environment, so deploys queue rather than race. Nothing is
    # cancelled: a superseded deploy must finish tearing down first.
    concurrency:
      group: pages
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      # A project site is served from a subdirectory named after the repo, so the
      # build cannot assume a root. Taking the path from the step above means a
      # custom domain — root, `base_path` of `/` — needs no change here.
      - name: Build
        run: pnpm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - id: deploy
        uses: actions/deploy-pages@v4
