# Everything the three CI jobs need before running a script.
#
# Node's version comes from `.tool-versions` (the file asdf reads locally) and
# pnpm's from `packageManager` in package.json, so CI and a developer's machine
# cannot drift: neither version is written down twice.
#
# The checkout is not here and cannot be: a local action loads from the working
# directory, so the repo must already be on disk. Each job checks out first.
name: Setup
description: Installs the toolchain and the project's dependencies

runs:
  using: composite
  steps:
    # Before setup-node, so `cache: pnpm` below has a store to point at.
    - uses: pnpm/action-setup@v4

    - uses: actions/setup-node@v6
      with:
        node-version-file: .tool-versions
        cache: pnpm

    - run: pnpm install --frozen-lockfile
      shell: bash
