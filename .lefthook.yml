# Git hooks, managed by lefthook. Reference: https://lefthook.dev/configuration/
#
# The installed hook in .git/hooks is a shim that re-reads this file on every
# run, so editing a job below takes effect right away. Re-run
# `pnpm exec lefthook install` only when adding or removing a hook itself —
# a top-level key like `pre-push` — since that needs a new shim on disk.

pre-commit:
  exclude:
    - '*.md'

  # Jobs run top to bottom, and `piped` aborts at the first failure: no point
  # formatting code that does not lint, or verifying a tree we already know is
  # broken. The order is load-bearing — `eslint --fix` rewrites code, so
  # Prettier runs afterwards to normalise whatever it produced.
  piped: true
  jobs:
    - name: lint
      glob: '*.{js,ts,svelte}'
      run: pnpm exec eslint --fix --no-warn-ignored {staged_files}
      stage_fixed: true

    - name: format
      run: pnpm exec prettier --write --ignore-unknown {staged_files}
      stage_fixed: true

    # The jobs above only ever see staged files. This one re-checks the whole
    # repo and adds the typecheck and unit tests, so it is not the redundancy
    # it looks like.
    - name: verify
      run: pnpm run verify

# The end-to-end suite is too slow to sit in front of every commit, so it
# guards the push instead — the last point where a failure is still cheap to
# fix locally.
pre-push:
  jobs:
    - name: e2e
      run: pnpm run test:e2e
