# Git hooks, managed by lefthook. https://lefthook.dev/configuration/
#
# .git/hooks holds a shim that re-reads this file each run, so job edits take
# effect at once. Re-run `pnpm exec lefthook install` only when adding or
# removing a hook itself (a top-level key like `pre-push`): that needs a shim.

pre-commit:
  exclude:
    - '*.md'

  # Top to bottom, `piped` aborting at the first failure: no point formatting
  # code that does not lint, or verifying a tree known to be broken. Order is
  # load-bearing — `eslint --fix` rewrites code, so Prettier runs after it.
  piped: true
  jobs:
    - name: lint
      glob: '*.{js,ts,svelte}'
      run: pnpm exec eslint --fix --no-warn-ignored {staged_files}
      stage_fixed: true

    - name: format
      run: pnpm exec prettier --write --ignore-unknown {staged_files}
      stage_fixed: true

    # The jobs above only see staged files. This re-checks the whole repo and
    # adds typecheck and unit tests — not the redundancy it looks like.
    - name: verify
      run: pnpm run verify

# Too slow for every commit, so it guards the push — the last point where a
# failure is cheap to fix locally.
pre-push:
  jobs:
    - name: e2e
      run: pnpm run test:e2e
